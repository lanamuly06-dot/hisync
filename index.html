<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HISYNC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f7ff">
<link rel="icon" href="Tak berjudul108_20261011224016.png">
<link rel="apple-touch-icon" href="Tak berjudul108_20261011224016.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HISYNC">
<script>if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="splash"><img src="Tak berjudul108_20261011224016.png" alt="HISYNC"></div>
<style>
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash img{width:200px;max-width:55vw;height:auto;animation:pop 1s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#splash.out{opacity:0;pointer-events:none}
</style>
<script>
(function(){var s=document.getElementById("splash");setTimeout(function(){s.classList.add("out")},1400);setTimeout(function(){s.remove()},1900)})();
</script>

<div id="gate" class="wrap"><p class="sub">Memuat…</p></div>

<div id="auth" class="wrap hide">
  <h1 class="logo">HISYNC</h1><p class="sub">Masuk atau buat akun untuk bergabung</p>
  <div id="fm">
    <button class="sb" id="bg">Lanjut dengan Google</button>
    <button class="sb" id="bf">Lanjut dengan Facebook</button>
    <div class="or">atau dengan email</div>
    <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min. 6 karakter)" style="margin-top:8px" autocomplete="current-password">
    <div class="row2"><button class="btn" id="bin">Masuk</button><button class="btn ghost" id="bup" style="margin-top:20px">Daftar</button></div>
    <button class="lnk" id="bfp">Lupa password?</button>
    <div class="or">atau dengan nomor telepon</div>
    <input id="ph" type="tel" placeholder="+62 812xxxxxxx">
    <button class="btn ghost" id="bsms">Kirim kode SMS</button>
    <div id="cdw" class="hide"><input id="cd" inputmode="numeric" placeholder="Kode 6 digit" style="margin-top:8px"><button class="btn" id="bcode">Verifikasi</button></div>
  </div>
  <div id="fs" class="hide">
    <p class="sub" style="margin-top:-14px">Satu langkah lagi: buat identitasmu di HISYNC</p>
    <label>Nama tampilan</label><input id="sn" maxlength="24" placeholder="Nama kamu">
    <label>Username</label><input id="su" maxlength="20" placeholder="tanpa spasi, mis. fans_hisync">
    <button class="btn" id="signup">Lanjut</button><button class="btn ghost" id="fsout">Ganti akun</button>
  </div>
  <div id="rc"></div><div class="err" id="aerr"></div>
</div>

<div id="setup" class="wrap hide">
  <h1 style="font-size:24px;padding:0" id="stt">Lengkapi profilmu</h1><p class="sub">Pilih bias dan tulis bio singkat</p><div style="text-align:center"><div id="ppv2" style="display:flex;justify-content:center;margin:6px 0 10px"></div><button class="ib" id="ppg">🖼 Galeri</button><button class="ib" id="ppc">📷 Kamera</button></div>
  <label>Bias favoritmu</label>
  <div class="bias" id="bias"></div>
  <label>Bio</label><textarea id="bio" rows="4" maxlength="160" placeholder="Ceritakan tentang dirimu…"></textarea>
  <button class="btn" id="done">Simpan</button>
  <button class="btn ghost hide" id="cancel">Batal</button>
</div>

<div id="app" class="hide">
  <header><span class="logo">HISYNC</span><span id="hi" class="tm"></span></header>
  <main>
    <section id="v-home">
      <div class="hero"><div class="hp"><img src="IMG-20260903-WA0074.jpg" alt=""><img src="IMG-20260903-WA0004.jpg" alt=""><img src="IMG-20260901-WA0016.jpg" alt=""></div><div class="ht"><b>HISYNC</b><span>3 members · Always with you</span></div></div>
      <div class="stories" id="stories"></div>
      <div class="box" style="flex-wrap:wrap"><textarea id="pt" rows="2" maxlength="280" placeholder="Apa yang kamu rasakan hari ini?"></textarea><div id="ppv" style="flex:1 1 100%"></div><button class="ib" id="pg">🖼 Galeri</button><button class="ib" id="pc">📷 Kamera</button><button id="pb" style="margin-left:auto;padding:10px 18px">Kirim</button></div>
      <div id="posts"></div>
    </section>
    <section id="v-chat" class="hide"><div class="msgs" id="msgs"></div>
      <div class="cbar"><input id="ct" maxlength="200" placeholder="Ketik pesan…"><button id="cb">Kirim</button></div></section>
    <section id="v-live" class="hide"><div id="livebox"></div></section>
    <section id="v-mem" class="hide"><div id="mems"></div></section>
    <section id="v-me" class="hide"><div id="meb"></div></section>
  </main>
  <nav id="nav">
    <button data-t="home" class="on"><b><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></b>Beranda</button>
    <button data-t="chat"><b><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5l8.5 5.8 8.5-5.8"/></svg></b>Inbox</button>
    <button data-t="live"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M7.6 7.6a6.2 6.2 0 0 0 0 8.8M16.4 7.6a6.2 6.2 0 0 1 0 8.8M4.6 4.6a10.4 10.4 0 0 0 0 14.8M19.4 4.6a10.4 10.4 0 0 1 0 14.8"/></svg></b>Live</button>
    <button data-t="mem"><b><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></b>Member</button>
    <button data-t="me"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></b>Profil</button>
  </nav>
</div>
<input type="file" id="fg" accept="image/*" hidden><input type="file" id="fc" accept="image/*" capture="user" hidden>
<div id="sh" class="hide"><div class="sheet"><b>Buat Story</b><textarea id="stx" rows="3" maxlength="100" placeholder="Tulis sesuatu (opsional)"></textarea><div id="spv"></div><button class="ib" id="sg">🖼 Galeri</button><button class="ib" id="sc">📷 Kamera</button><button class="btn" id="spost">Bagikan</button><button class="btn ghost" id="scx">Batal</button></div></div>
<div id="sv" class="hide"></div>
<script>
window.onerror=function(m,s,l){alert("Error: "+m+" ("+String(s).split("/").pop()+":"+l+")")};
window.addEventListener("error",function(e){if(e.target&&e.target.tagName==="SCRIPT")alert("Gagal memuat: "+String(e.target.src).split("/").pop())},true);
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="members.js"></script>
<script src="settings.js"></script>
<script src="social.js"></script>
<script src="feed.js"></script>
<script src="extras.js"></script>
</body>
</html>
